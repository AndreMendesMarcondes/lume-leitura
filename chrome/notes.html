<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lume — Marcações</title>
<style>
  :root { --bg:#f7f6f2; --fg:#1d1d1f; --mut:#6b6f76; --card:#fff; --line:#e7e5df; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --fg:#e8e8ea; --mut:#9aa0a6; --card:#1f2226; --line:#2c3036; } }
  body { margin:0; background:var(--bg); color:var(--fg); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .top { display:flex; align-items:center; gap:10px; margin-bottom: 24px; }
  .top p { flex:1; color: var(--mut); margin:0; }
  input[type=search] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:15px; margin-bottom: 20px; }
  button { border:1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 6px 12px; cursor:pointer; font-size: 13px; }
  section { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  section header { display:flex; gap:10px; align-items:baseline; margin-bottom: 8px; }
  section header a { flex:1; font-weight:600; color: inherit; }
  section header small { color: var(--mut); }
  blockquote { margin: 10px 0; padding: 2px 12px; border-left: 4px solid #e6c800; }
  blockquote[data-c=green] { border-color:#3fbf4a } blockquote[data-c=pink] { border-color:#ff5aa8 } blockquote[data-c=blue] { border-color:#3d8bfd }
  .note { color: var(--mut); font-size: 14px; margin: -4px 0 8px 16px; }
  .empty { color: var(--mut); text-align:center; padding: 60px 0; }
</style>
</head>
<body>
<main>
  <h1>Minhas marcações</h1>
  <div class="top"><p>Tudo que você marcou com o Lume, por página.</p><button id="exportAll">Exportar tudo (.md)</button></div>
  <input type="search" id="q" placeholder="Buscar nas marcações e notas…">
  <div id="list"></div>
</main>
<script src="notes.js"></script>
</body>
</html>
